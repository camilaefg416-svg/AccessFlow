<main class="register-wrapper">

  <!-- LADO ESQUERDO -->
  <header class="register-info">
    <h1>Criar Conta</h1>
    <p>Preencha os dados para se cadastrar no sistema</p>

    <span>Já possui conta?</span>
    <a href="index.html">Voltar para o login</a>
  </header>

  <!-- LADO DIREITO -->
  <section class="register-card">
    <form id="registerForm">

      <div class="input-group">
        <label>Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Digite seu email">
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha">
      </div>

      <div class="input-group">
        <label>Confirmar senha</label>
        <input type="password" id="confirmar" placeholder="Repita a senha">
      </div>

      <button type="submit">Cadastrar</button>

    </form>
  </section>

</main>
